# 부하 테스트 전용 스택 — 개발 스택(docker-compose.yml)과 포트·볼륨·컨테이너명을 분리한다.
# 실행:  docker compose -f docker-compose.loadtest.yml up -d --build
# 계측:  http://localhost:8081/actuator/prometheus
services:
  postgres-loadtest:
    build:
      context: ./backend/docker/postgres
      dockerfile: Dockerfile
    container_name: territorial-postgres-loadtest
    environment:
      POSTGRES_DB: territorial_loadtest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-loadtest-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-loadtest:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    container_name: territorial-redis-loadtest
    ports:
      - "6380:6379"
    volumes:
      - redis-loadtest-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-loadtest:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: territorial-backend-loadtest
    ports:
      - "8081:8080"
    env_file:
      - ./backend/.env            # JWT_SECRET·OAuth 등 (개발 스택과 공유)
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: loadtest
      DB_HOST: postgres-loadtest
      DB_PORT: 5432
      DB_NAME: territorial_loadtest
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis-loadtest
      REDIS_PORT: 6379
      ADMIN_IP_ALLOWLIST: ""
      LOADTEST_TOKEN_OUTPUT: /app/loadtest-output/tokens.csv
    volumes:
      - ./backend/src/gatling/resources:/app/loadtest-output
    depends_on:
      postgres-loadtest:
        condition: service_healthy
      redis-loadtest:
        condition: service_healthy

volumes:
  postgres-loadtest-data:
  redis-loadtest-data:
