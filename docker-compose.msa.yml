# MSA 풀스택 로컬 구동 (Strangler 전환 상태 전체).
#   docker compose -f docker-compose.msa.yml up -d --build
#
# 구성:
#   - DB 분리: 모놀리식 / auction-service / user-service / combat-service가 각각 자기 PostgreSQL을 소유.
#   - Kafka: durable 서비스 이벤트. Redis: 분산락·캐시·auction realtime pub/sub.
#   - 게이트웨이: auction·auth·wallet 공개 경로를 분리 서비스로 라우팅하고 access JWT만 X-User-Id로 변환.
#   - 프론트: 게이트웨이로 프록시.
# 모놀리식 단독(전환 이전) 구동은 docker-compose.yml 사용.
services:
  # ── 공유 이벤트 버스 / 캐시 ────────────────────────────────
  redis:
    build:
      context: ./backend/docker/redis
      dockerfile: Dockerfile
    container_name: msa-redis
    ports:
      - "6379:6379"
    volumes:
      - msa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft 단일 노드) — durable 이벤트 백본 ──────────
  kafka:
    image: apache/kafka:3.9.0
    container_name: msa-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: msa-kafka-cluster-01
    healthcheck:
      test:
        ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15

  # ── 모놀리식 DB ───────────────────────────────────────────
  postgres:
    build:
      context: ./backend/docker/postgres
      dockerfile: Dockerfile
    container_name: msa-postgres
    environment:
      POSTGRES_DB: territorial_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - msa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── auction-service 전용 DB (분리) ────────────────────────
  auction-postgres:
    image: postgres:16-alpine
    container_name: msa-auction-postgres
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    ports:
      - "5433:5432"
    volumes:
      - msa-auction-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── user-service 전용 DB (분리) ───────────────────────────
  user-postgres:
    image: postgres:16-alpine
    container_name: msa-user-postgres
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    volumes:
      - msa-user-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── combat-service 전용 DB (분리) ───────────────────────
  combat-postgres:
    image: postgres:16-alpine
    container_name: msa-combat-postgres
    environment:
      POSTGRES_DB: combat
      POSTGRES_USER: combat
      POSTGRES_PASSWORD: combat
    ports:
      - "5434:5432"
    volumes:
      - msa-combat-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U combat -d combat"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── social-service 전용 DB (분리) ─────────────────────────
  social-postgres:
    image: postgres:16-alpine
    container_name: msa-social-postgres
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
    volumes:
      - msa-social-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── notification-service 전용 DB (분리) ───────────────────
  notification-postgres:
    image: postgres:16-alpine
    container_name: msa-notification-postgres
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    volumes:
      - msa-notification-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── item-service 전용 DB (분리) ───────────────────────────
  item-postgres:
    image: postgres:16-alpine
    container_name: msa-item-postgres
    environment:
      POSTGRES_DB: item
      POSTGRES_USER: item
      POSTGRES_PASSWORD: item
    volumes:
      - msa-item-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U item -d item"]
      interval: 10s
      timeout: 5s
      retries: 5

  season-postgres:
    image: postgres:16-alpine
    container_name: msa-season-postgres
    environment:
      POSTGRES_DB: season
      POSTGRES_USER: season
      POSTGRES_PASSWORD: season
    volumes:
      - msa-season-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U season -d season"]
      interval: 10s
      timeout: 5s
      retries: 5

  ranking-postgres:
    image: postgres:16-alpine
    container_name: msa-ranking-postgres
    environment:
      POSTGRES_DB: ranking
      POSTGRES_USER: ranking
      POSTGRES_PASSWORD: ranking
    volumes:
      - msa-ranking-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranking -d ranking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 모놀리식 ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msa-backend
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: territorial_auction
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUCTION_SERVICE_BASE_URL: http://auction-service:8080
      USER_SERVICE_BASE_URL: http://user-service:8080
      COMBAT_SERVICE_BASE_URL: http://combat-service:8080
      SOCIAL_SERVICE_BASE_URL: http://social-service:8080
      ITEM_SERVICE_BASE_URL: http://item-service:8080
      SEASON_SERVICE_BASE_URL: http://season-service:8080
      RANKING_SERVICE_BASE_URL: http://ranking-service:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ADMIN_IP_ALLOWLIST: ""
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── auction-service ──────────────────────────────────────
  auction-service:
    build:
      context: .
      dockerfile: services/auction-service/Dockerfile
    container_name: msa-auction-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: auction-postgres
      DB_PORT: 5432
      DB_NAME: auction
      DB_USERNAME: auction
      DB_PASSWORD: auction
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONOLITH_BASE_URL: http://backend:8080
      USER_SERVICE_BASE_URL: http://user-service:8080
      COMBAT_SERVICE_BASE_URL: http://combat-service:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8080"
    depends_on:
      auction-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── user-service ─────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: msa-user-service
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Seoul
      DB_HOST: user-postgres
      DB_PORT: 5432
      DB_NAME: user
      DB_USERNAME: user
      DB_PASSWORD: user
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      user-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── combat-service ──────────────────────────────────────
  combat-service:
    build:
      context: .
      dockerfile: services/combat-service/Dockerfile
    container_name: msa-combat-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: combat-postgres
      DB_PORT: 5432
      DB_NAME: combat
      DB_USERNAME: combat
      DB_PASSWORD: combat
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONOLITH_BASE_URL: http://backend:8080
      USER_SERVICE_BASE_URL: http://user-service:8080
    ports:
      - "8084:8080"
    depends_on:
      combat-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── social-service ───────────────────────────────────────
  social-service:
    build:
      context: .
      dockerfile: services/social-service/Dockerfile
    container_name: msa-social-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: social-postgres
      DB_PORT: 5432
      DB_NAME: social
      DB_USERNAME: social
      DB_PASSWORD: social
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONOLITH_BASE_URL: http://backend:8080
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── notification-service ─────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: msa-notification-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: notification-postgres
      DB_PORT: 5432
      DB_NAME: notification
      DB_USERNAME: notification
      DB_PASSWORD: notification
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      notification-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── item-service ─────────────────────────────────────────
  item-service:
    build:
      context: .
      dockerfile: services/item-service/Dockerfile
    container_name: msa-item-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: item-postgres
      DB_PORT: 5432
      DB_NAME: item
      DB_USERNAME: item
      DB_PASSWORD: item
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USER_SERVICE_BASE_URL: http://user-service:8080
      COMBAT_SERVICE_BASE_URL: http://combat-service:8080
      MONOLITH_BASE_URL: http://backend:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    depends_on:
      item-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── season-service ───────────────────────────────────────
  season-service:
    build:
      context: .
      dockerfile: services/season-service/Dockerfile
    container_name: msa-season-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: season-postgres
      DB_PORT: 5432
      DB_NAME: season
      DB_USERNAME: season
      DB_PASSWORD: season
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_BASE_URL: http://user-service:8080
      COMBAT_SERVICE_BASE_URL: http://combat-service:8080
      ITEM_SERVICE_BASE_URL: http://item-service:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    depends_on:
      season-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── ranking-service ──────────────────────────────────────
  ranking-service:
    build:
      context: .
      dockerfile: services/ranking-service/Dockerfile
    container_name: msa-ranking-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: ranking-postgres
      DB_PORT: 5432
      DB_NAME: ranking
      DB_USERNAME: ranking
      DB_PASSWORD: ranking
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEASON_SERVICE_BASE_URL: http://season-service:8080
      USER_SERVICE_BASE_URL: http://user-service:8080
      MONOLITH_BASE_URL: http://backend:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    depends_on:
      ranking-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ── API 게이트웨이 ────────────────────────────────────────
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: msa-gateway
    env_file:
      - ./backend/.env   # JWT_SECRET 공유 — 모놀리식과 동일 서명키로 검증
    environment:
      TZ: Asia/Seoul
      AUCTION_SERVICE_URL: http://auction-service:8080
      USER_SERVICE_URL: http://user-service:8080
      COMBAT_SERVICE_URL: http://combat-service:8080
      SOCIAL_SERVICE_URL: http://social-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      ITEM_SERVICE_URL: http://item-service:8080
      SEASON_SERVICE_URL: http://season-service:8080
      RANKING_SERVICE_URL: http://ranking-service:8080
      MONOLITH_URL: http://backend:8080
      MONOLITH_WS_URL: ws://backend:8080
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?INTERNAL_API_SECRET is required}
    ports:
      - "8090:8080"
    depends_on:
      - backend
      - auction-service
      - user-service
      - combat-service
      - social-service
      - notification-service
      - item-service
      - season-service
      - ranking-service

  # ── 프론트 (게이트웨이로 프록시) ──────────────────────────
  frontend:
    image: node:20-alpine
    container_name: msa-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:5173"
    environment:
      API_TARGET: http://gateway:8080
      WS_TARGET: ws://gateway:8080
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - gateway

volumes:
  msa-redis-data:
  msa-postgres-data:
  msa-auction-pg-data:
  msa-user-pg-data:
  msa-combat-pg-data:
  msa-social-pg-data:
  msa-notification-pg-data:
  msa-item-pg-data:
  msa-season-pg-data:
  msa-ranking-pg-data:
