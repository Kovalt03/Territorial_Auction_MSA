# MSA 로컬 구동 (Strangler 전환용). 모놀리식 docker-compose.yml과 별개.
# 스캐폴드 단계 검증:
#   docker compose -f docker-compose.msa.yml up -d --build auction-postgres auction-service
#   docker compose -f docker-compose.msa.yml exec auction-service wget -qO- localhost:8080/actuator/health
services:
  redis:
    image: redis:7-alpine
    container_name: msa-redis
    ports:
      - "6380:6379"   # 모놀리식 redis(6379)와 충돌 회피
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auction-postgres:
    image: postgres:16-alpine
    container_name: msa-auction-postgres
    environment:
      POSTGRES_DB: auction
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
    ports:
      - "5433:5432"   # 모놀리식 postgres(5432)와 충돌 회피
    volumes:
      - auction-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 10s
      timeout: 5s
      retries: 5

  auction-service:
    build:
      context: ./services/auction-service
      dockerfile: Dockerfile
    container_name: msa-auction-service
    environment:
      TZ: Asia/Seoul
      DB_HOST: auction-postgres
      DB_PORT: 5432
      DB_NAME: auction
      DB_USERNAME: auction
      DB_PASSWORD: auction
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONOLITH_BASE_URL: http://backend:8080   # Part B 이후 실제 호출 대상(현재 모놀리식 미포함이라 호출 시에만 필요)
    ports:
      - "8081:8080"   # 모놀리식 backend(8080)와 충돌 회피
    depends_on:
      auction-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: msa-gateway
    env_file:
      - ./backend/.env   # JWT_SECRET 공유 — 모놀리식과 동일 서명키로 검증
    environment:
      TZ: Asia/Seoul
      AUCTION_SERVICE_URL: http://auction-service:8080
      # 모놀리식은 별도 compose(docker-compose.yml)에서 실행 → host 경유. 필요 시 override.
      MONOLITH_URL: ${MONOLITH_URL:-http://host.docker.internal:8080}
      MONOLITH_WS_URL: ${MONOLITH_WS_URL:-ws://host.docker.internal:8080}
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - auction-service

volumes:
  auction-pg:
