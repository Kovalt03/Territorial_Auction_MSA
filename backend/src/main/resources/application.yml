spring:
  application:
    name: auction

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:territorial_auction}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname, account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000    # 30분 (ms)
  refresh-token-expiry: 1209600000 # 14일 (ms)

admin:
  # 관리자 로그인 허용 IP. 비워두면 모든 IP 허용(개발). 운영에서는 화이트리스트 지정.
  ip-allowlist: ${ADMIN_IP_ALLOWLIST:}
  # 관리자 시드 계정. email/password 가 모두 설정된 경우에만 부트스트랩(운영은 미설정 권장).
  seed:
    email: ${ADMIN_SEED_EMAIL:}
    password: ${ADMIN_SEED_PASSWORD:}

server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# 분리된 auction-service — admin 조회가 /internal로 직접 호출
auction-service:
  base-url: ${AUCTION_SERVICE_BASE_URL:http://localhost:8082}

# 분리된 user-service — 지갑(AP) 명령·조회를 /internal로 호출
user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8083}
combat-service:
  base-url: ${COMBAT_SERVICE_BASE_URL:http://localhost:8084}
# 분리된 social-service — admin 채팅 검열을 /internal로 위임 호출
social-service:
  base-url: ${SOCIAL_SERVICE_BASE_URL:http://localhost:8085}
internal-api:
  secret: ${INTERNAL_API_SECRET:local-internal-secret}
