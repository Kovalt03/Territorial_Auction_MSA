# zone1Radius / zone2Radius 는 격자 중심으로부터의 체비쇼프 거리 — 그 바깥이 Zone3.
# 등급이 커져도 Zone 비율이 유지되도록 대략 gridSize/5, gridSize×2/5 를 따른다.
territoryGrades:
  - grade: "S"
    productionMultiplier: 3.0
    auctionPriceMultiplier: 3.0
    preBuiltCount: 3
    spawnRate: 0.050
    gridSize: 20
    zone1Radius: 4
    zone2Radius: 8

  - grade: "A"
    productionMultiplier: 2.0
    auctionPriceMultiplier: 2.0
    preBuiltCount: 2
    spawnRate: 0.150
    gridSize: 16
    zone1Radius: 3
    zone2Radius: 6

  - grade: "B"
    productionMultiplier: 1.5
    auctionPriceMultiplier: 1.5
    preBuiltCount: 1
    spawnRate: 0.350
    gridSize: 12
    zone1Radius: 2
    zone2Radius: 5

  - grade: "C"
    productionMultiplier: 1.0
    auctionPriceMultiplier: 1.0
    preBuiltCount: 0
    spawnRate: 0.450
    gridSize: 8
    zone1Radius: 2
    zone2Radius: 3
