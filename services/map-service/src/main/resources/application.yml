spring:
  application:
    name: map-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:map}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:map}
    password: ${DB_PASSWORD:map}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}

# GP·저장소·수입 적립·토지세 수금 위임
combat-service:
  base-url: ${COMBAT_SERVICE_BASE_URL:http://localhost:8084}
# 활성 시즌·토지세 면제 보너스 조회
season-service:
  base-url: ${SEASON_SERVICE_BASE_URL:http://localhost:8088}
# 영토 점유 종료(hold-close) 위임
ranking-service:
  base-url: ${RANKING_SERVICE_BASE_URL:http://localhost:8089}
# 소유자 닉네임 배치 조회
user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8083}
internal-api:
  secret: ${INTERNAL_API_SECRET:local-internal-secret}
