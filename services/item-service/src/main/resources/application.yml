spring:
  application:
    name: item-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:item}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:item}
    password: ${DB_PASSWORD:item}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8083}
combat-service:
  base-url: ${COMBAT_SERVICE_BASE_URL:http://localhost:8084}
monolith:
  base-url: ${MONOLITH_BASE_URL:http://localhost:8081}
internal-api:
  secret: ${INTERNAL_API_SECRET:local-internal-secret}
