spring:
  application:
    name: auction-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auction}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:auction}
    password: ${DB_PASSWORD:auction}
    driver-class-name: org.postgresql.Driver

  jpa:
    # 스키마는 Flyway가 소유 — Hibernate는 검증만
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

# 스캐폴드 단계: health만 노출
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
