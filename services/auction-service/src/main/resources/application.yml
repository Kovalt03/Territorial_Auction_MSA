spring:
  application:
    name: auction-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auction}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:auction}
    password: ${DB_PASSWORD:auction}
    driver-class-name: org.postgresql.Driver

  jpa:
    # 스키마는 Flyway가 소유 — Hibernate는 검증만
    hibernate:
      ddl-auto: validate
      naming:
        # coordX → coord_x 로 매핑(프로젝트 snake_case 컨벤션). 미지정 시 coordx 로 기대해 validate 실패.
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

monolith:
  base-url: ${MONOLITH_BASE_URL:http://localhost:8080}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8083}

internal-api:
  secret: ${INTERNAL_API_SECRET}

# 스캐폴드 단계: health만 노출
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
