server:
  port: ${PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # user-service가 /api/v1/users 전체(프로필 조회·지갑 표시·AP 충전·위시리스트·신원 쓰기·설정·탈퇴)를 서빙한다.
        # 프로필/지갑 합성(GP·섬·시즌패스·영토수)은 user-service가 combat·season·map 내부 계약으로 조립.
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service-users
          uri: ${USER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/users/**
        # 경매 REST는 auction-service로
        - id: auction-service
          uri: ${AUCTION_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auctions/**
        # combat 공개 API는 gateway가 발급한 서비스 토큰과 검증된 userId만 신뢰한다.
        - id: combat-service
          uri: ${COMBAT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/buildings/**,/api/v1/building-types,/api/v1/building-shop/**,/api/v1/island/**,/api/v1/inventory/**,/api/v1/global-vault/**,/api/v1/military/**,/api/v1/siege/**,/api/v1/map/territories/*/buildings
          filters:
            - AddRequestHeader=X-Gateway-Service-Token, ${INTERNAL_API_SECRET}
        # 채팅·길드·소셜은 social-service로
        - id: social-service
          uri: ${SOCIAL_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/chat/**,/api/v1/guilds/**,/api/v1/social/**
        # 알림은 notification-service로
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/notifications/**
        # 아이템(상점·인벤토리·사용)은 item-service로
        - id: item-service
          uri: ${ITEM_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/items/**
        # 시즌패스·미션·보상은 season-service로 (시즌 관리는 모놀리식 /** 폴백)
        - id: season-service
          uri: ${SEASON_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/season-pass/**
        # 랭킹(트로피·영토보유·경매소비·대륙)은 ranking-service로. 공개 조회 — 토큰 있으면 게이트웨이가 X-User-Id 주입
        - id: ranking-service
          uri: ${RANKING_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/api/v1/rankings/**
        # 맵·영토·대륙·토지세는 map-service로 (공유 커널 map 추출). 공개 조회 + 인증은 X-User-Id 주입.
        # combat의 /api/v1/map/territories/*/buildings 라우트가 위에 있어 그것만 combat이 먼저 가져간다.
        - id: map-service
          uri: ${MAP_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/v1/map/**,/api/v1/continents/**,/api/v1/territories/**,/api/v1/land-tax/**
        # 관리 콘솔은 admin-service로 (자체 인증). admin 토큰은 게임 jwt.secret으로 검증되지 않아
        # UserIdInjectionFilter가 X-User-Id를 주입하지 않는다 → 설계대로 admin이 자체 Bearer로만 인증.
        # /api/v1/admin/auth/login·GET /api/v1/announcement는 admin-service가 공개로 서빙.
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/v1/admin/**,/api/v1/announcement
        # WebSocket(실시간 허브)은 모놀리식
        - id: monolith-ws
          uri: ${MONOLITH_WS_URL:ws://localhost:8081}
          predicates:
            - Path=/ws/**
        # 그 외 전부 모놀리식
        - id: monolith
          uri: ${MONOLITH_URL:http://localhost:8081}
          predicates:
            - Path=/**

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
