spring:
  application:
    name: ranking-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ranking}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:ranking}
    password: ${DB_PASSWORD:ranking}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ranking-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}

# 트로피·활성시즌·게임이벤트 위임
season-service:
  base-url: ${SEASON_SERVICE_BASE_URL:http://localhost:8088}
# 닉네임 배치 조회
user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8083}
# 대륙 트로피 밴드(공유 커널 map은 모놀리식 소유)
monolith:
  base-url: ${MONOLITH_BASE_URL:http://localhost:8081}
internal-api:
  secret: ${INTERNAL_API_SECRET:local-internal-secret}
