spring:
  application:
    name: social-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:social}?sslmode=${DB_SSL_MODE:disable}
    username: ${DB_USERNAME:social}
    password: ${DB_PASSWORD:social}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${PORT:8080}

user-service:
  base-url: ${USER_SERVICE_BASE_URL:http://localhost:8083}
monolith:
  base-url: ${MONOLITH_BASE_URL:http://localhost:8080}
internal-api:
  secret: ${INTERNAL_API_SECRET:local-internal-secret}
