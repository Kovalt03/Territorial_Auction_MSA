services:
  - type: web
    name: territorial-auction-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: off
    envVars:
      # Render Free 인스턴스의 기본 JVM 힙은 Spring Data 초기화에 부족하다.
      - key: JAVA_TOOL_OPTIONS
        value: -Xms128m -Xmx320m
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: FRONTEND_BASE_URL
        value: https://territorial-auction-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://territorial-auction-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: ADMIN_IP_ALLOWLIST
        value: ""
      - key: ADMIN_SEED_EMAIL
        sync: false
      - key: ADMIN_SEED_PASSWORD
        sync: false

  - type: web
    name: territorial-auction-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE_URL
        value: https://territorial-auction-api.onrender.com/api/v1
      - key: VITE_WS_URL
        value: https://territorial-auction-api.onrender.com/ws
