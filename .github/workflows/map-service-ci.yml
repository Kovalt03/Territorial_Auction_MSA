name: Map Service CI

on:
  pull_request:
    branches: [dev, main, 'msa/**']
    paths:
      - 'services/map-service/**'
      - 'libs/common/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x libs/common/gradlew services/map-service/gradlew

      - name: Publish common locally
        working-directory: libs/common
        run: ./gradlew publishToMavenLocal -x test --no-daemon

      - name: Check code format
        working-directory: services/map-service
        run: ./gradlew spotlessCheck --no-daemon

      - name: Build and test
        working-directory: services/map-service
        run: ./gradlew build --no-daemon
