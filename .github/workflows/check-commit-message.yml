name: Check Commit Message

on:
  pull_request:
    branches: [dev, main, 'msa/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          INVALID=0

          # [TYPE] 뒤에 선택적 도메인 브라켓 허용: [TYPE][auction], [TYPE][fe], [TYPE][infra]
          PATTERN='^\[(FEAT|FIX|HOTFIX|REFACTOR|TEST|CHORE|DOCS|STYLE|PERF)\](\[[a-z0-9-]+\])? .+'

          while IFS= read -r msg; do
            # Merge 커밋은 검사에서 제외
            if echo "$msg" | grep -qP '^Merge '; then
              continue
            fi
            if ! echo "$msg" | grep -qP "$PATTERN"; then
              echo "❌ 올바르지 않은 커밋 메시지: $msg"
              INVALID=1
            fi
          done < <(git log --pretty=format:"%s" "$BASE".."$HEAD")

          if [ $INVALID -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "  커밋 메시지 규칙"
            echo "========================================"
            echo ""
            echo "  형식: [PREFIX][domain] 제목    ([domain]은 선택 — MSA 도메인 표기)"
            echo ""
            echo "  PREFIX 목록:"
            echo "    [FEAT]      새로운 기능 추가"
            echo "    [FIX]       버그 수정"
            echo "    [HOTFIX]    프로덕션 긴급 버그 수정"
            echo "    [REFACTOR]  기능 변경 없는 코드 개선"
            echo "    [TEST]      테스트 코드 추가/수정"
            echo "    [CHORE]     빌드 설정, 의존성, 개발 환경"
            echo "    [DOCS]      문서 작성/수정"
            echo "    [STYLE]     포맷 등 로직 무관 스타일"
            echo "    [PERF]      성능 개선"
            echo ""
            echo "  예시:"
            echo "    [FEAT][auction] 입찰 분산락 적용"
            echo "    [FIX][map] 영토 만료 브로드캐스트 누락 수정"
            echo "    [FEAT][fe] 입찰 폼 UI"
            echo "    [DOCS][infra] CI/CD 정책 문서화"
            echo "    [CHORE] Spring Boot 의존성 추가       (도메인 생략 가능)"
            echo ""
            echo "  도메인: auth user map auction military building guild social"
            echo "          notification item season / fe(프론트) / infra(횡단)"
            echo ""
            echo "  이슈 연결은 커밋 본문에 작성하세요:"
            echo "    Closes #번호     → PR 머지 시 이슈 자동 Close"
            echo "    Related to #번호 → 이슈 연결만 (Close 안 함)"
            echo "    Ref #번호        → 단순 참고용 연결"
            echo "========================================"
            exit 1
          fi

          echo "✅ 모든 커밋 메시지 형식이 올바릅니다."
