name: 기능 제안
description: 사용자 문제와 기대 결과를 기준으로 기능을 제안합니다.
title: "[FEAT] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 어떤 사용자 또는 운영 문제를 해결하나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 기대 동작과 완료 기준을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: API, 데이터, 보안, 성능, 운영 영향이 있으면 작성합니다.
  - type: textarea
    id: alternatives
    attributes:
      label: 대안
      description: 검토한 다른 접근이 있으면 작성합니다.
