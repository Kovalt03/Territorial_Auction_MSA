services:
  postgres:
    build:
      context: ./backend/docker/postgres
      dockerfile: Dockerfile
    container_name: territorial-postgres
    environment:
      POSTGRES_DB: territorial_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    build:
      context: ./backend/docker/redis
      dockerfile: Dockerfile
    container_name: territorial-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: territorial-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      # 서버는 단일 타임존(KST) 운영 — 앱이 LocalDateTime을 KST로 가정(+09:00 직렬화)하므로
      # 컨테이너 시각도 KST로 맞춘다. 미설정 시 컨테이너 기본 UTC로 9시간 어긋남.
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: territorial_auction
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # IP 화이트리스트 비움(전체 허용, 개발). 시드 관리자 계정(ADMIN_SEED_EMAIL/PASSWORD)은
      # 자격증명 노출 방지를 위해 backend/.env(gitignore)에만 정의한다.
      ADMIN_IP_ALLOWLIST: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: territorial-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:5173"
    environment:
      API_TARGET: http://backend:8080
      WS_TARGET: ws://backend:8080
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
